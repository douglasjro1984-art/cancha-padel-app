<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Canchas - Pádel App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <div class="container">
        <h2>Reserva tu Cancha</h2>
        <p class="subtitle">Gestiona tu turno rápido y fácil</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="/reservas" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre del Jugador</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="cancha">Seleccionar Cancha</label>
                <select id="cancha" name="cancha_id" required>
                    <option value="1">Cancha Cristal 1 (Techada)</option>
                    <option value="2">Cancha Cristal 2 (Descubierta)</option>
                    <option value="3">Cancha Premium (Blindex)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha del Turno</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="hora">Horario</label>
                <input type="time" id="hora" name="hora" required>
            </div>

            <button type="submit" class="btn-submit">Confirmar Turno 🎾</button>
        </form>
    </div>

    <script>
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha').setAttribute('min', hoy);
    </script>
</body>
</html>
